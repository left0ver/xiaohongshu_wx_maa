name: WeChat business tests

on:
  push:
    paths:
      - 'plugins/wechat/**'
      - 'plugins/xiaohongshu/tools/**'
      - '.github/workflows/wechat-tests.yml'
  pull_request:
    paths:
      - 'plugins/wechat/**'
      - 'plugins/xiaohongshu/tools/**'
      - '.github/workflows/wechat-tests.yml'

permissions:
  contents: read

jobs:
  business-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r plugins/wechat/wechat_channels/requirements.txt
      - run: python -m unittest discover -s plugins/wechat/tests
      - run: python -m unittest discover -s plugins/wechat/wechat_channels/collector
